name: Universal GKI Kernel Builder CI
run-name: "Build Custom GKI: ${{ inputs.build_name }} [${{ github.ref_name }}]"
on:
  workflow_dispatch:
    inputs:
      build_channel:
        description: 'Build Channel (switch to stable in case of errors/instability)'
        required: false
        type: choice
        options:
          - dynamic
          - stable
          - test

      build_name:
        description: "Build Name"
        required: true
        type: string

      target_version:
        description: "Kernel Version"
        required: true
        type: string

      root_manager:
        description: "Root Environment"
        required: false
        type: choice
        options:
          - KernelSU-Next
          - SukiSU-Ultra
          - ReSukiSU
          - KernelSU
          - Stock

      enable_ksu_susfs:
        description: "Integrate Root Manager and SUSFS?"
        required: false
        type: boolean
        default: true
        
      custom_kconfigs:
        description: "Inject custom Kconfigs (tools/custom.fragment)?"
        required: false
        type: boolean
        default: false

      custom_patches:
        description: "Apply User Patches and Inject Source Files?"
        required: false
        type: boolean
        default: false
        
      ota_url:
        description: "Full OTA ZIP URL (blank produces AK3 zip)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  OTA_URL: ${{ inputs.ota_url }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Evaluate OTA URL for payload.bin compatibility
        run: |
          sudo apt-get install -qq -y python3-venv > /dev/null
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -q requests remotezip
          echo "========================================"
          echo "        OTA VALIDATION RESULT           "
          echo "========================================"
          python3 scripts/validate_ota.py
          echo "========================================"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Create Manual 16GB Swap File
        run: |
          echo "=== Freeing up any existing partial swap ==="
          sudo swapoff -a
          if [ -f /swapfile ]; then sudo rm -f /swapfile; fi

          echo "=== Allocating 16GB Swap ==="
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "=== Verified Memory Configuration ==="
          free -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Manifest Branch from Database
        id: resolve_manifest
        run: |
          TARGET_RAW="${{ inputs.target_version }}"
          echo ">>> Raw input received: $TARGET_RAW"

          # Regex to extract only the first instance of an X.Y.Z version format
          TARGET=$(echo "$TARGET_RAW" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)

          if [ -z "$TARGET" ]; then
              echo "[-] Error: Could not extract a valid kernel version (e.g., 6.1.145) from the input."
              exit 1
          fi

          echo ">>> Clean Target Version extracted: $TARGET"

          # Extract the base version (e.g., turns 6.1.145 into 6.1)
          BASE_VER=$(echo "$TARGET" | cut -d. -f1,2)
          DB_FILE="tools/master_kernel_db.json"
          MANIFEST_BRANCH=""

          # --- QUERY UNIFIED JSON DATABASE ---
          if [ -f "$DB_FILE" ]; then
              echo ">>> Querying $DB_FILE for branch match..."

              # Extract the exact matching dictionary block for the kernel version
              JSON_RESULT=$(jq -r ".[\"$BASE_VER\"][] | select(.kernel == \"$TARGET\")" "$DB_FILE" 2>/dev/null || true)

              if [ -n "$JSON_RESULT" ]; then
                  A_VER=$(echo "$JSON_RESULT" | jq -r '.android_version')
                  K_DATE=$(echo "$JSON_RESULT" | jq -r '.date')
                  MANIFEST_BRANCH="common-${A_VER}-${BASE_VER}-${K_DATE}"

                  echo ">>> Precise match found in DB!"
              fi
          else
              echo "[-] Warning: Database file $DB_FILE not found in the repository."
          fi

          # --- LTS FALLBACK & CRASH LOGIC ---
          if [ -z "$MANIFEST_BRANCH" ]; then
              echo "[-] Exact version not mapped. Bypassing database and defaulting to standard LTS branch..."

              # Map standard GKI kernel bases to their logical LTS branches
              case "$BASE_VER" in
                  "5.10") ANDROID_VER="android13" ;;
                  "5.15") ANDROID_VER="android14" ;;
                  "6.1")  ANDROID_VER="android14" ;;
                  "6.6")  ANDROID_VER="android15" ;;
                  "6.12") ANDROID_VER="android16" ;;
                  "6.18") ANDROID_VER="android17" ;;
                  *)
                      # Total nonsense kills the build
                      echo "[-] Error: Unsupported base version $BASE_VER. Cannot resolve a valid LTS branch."
                      exit 1
                      ;;
              esac

              MANIFEST_BRANCH="common-${ANDROID_VER}-${BASE_VER}-lts"
          fi

          echo ">>> Target Branch successfully resolved: $MANIFEST_BRANCH"

          # Export to environment for subsequent sync steps
          echo "MANIFEST_BRANCH=${MANIFEST_BRANCH}" >> $GITHUB_ENV
          echo "MANIFEST_URL=https://android.googlesource.com/kernel/manifest" >> $GITHUB_ENV


      - name: Configure Build Channels
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          echo "=== Configuring Build Channel: ${{ inputs.build_channel }} ==="

          if [ "${{ inputs.build_channel }}" == "dynamic" ]; then

          # Route KernelSU, KernelSU-Next, ReSukiSU, and SukiSU-Ultra to the dynamic engine
          if [[ "${{ inputs.root_manager }}" == "KernelSU" || "${{ inputs.root_manager }}" == "KernelSU-Next" || "${{ inputs.root_manager }}" == "ReSukiSU" || "${{ inputs.root_manager }}" == "SukiSU-Ultra" ]]; then
               echo ">>> Routing ${{ inputs.root_manager }} to Automated Dynamic Transplant..."
               echo "USE_DYNAMIC_TRANSPLANT=true" >> $GITHUB_ENV
               echo "SUSFS_REPO_URL=https://gitlab.com/simonpunk/susfs4ksu.git" >> $GITHUB_ENV
               echo "KSU_VARIANT_REPO_URL=" >> $GITHUB_ENV
               echo "KSU_VARIANT_REF=stable" >> $GITHUB_ENV
             else
               # Any future/unsupported variants will fall back here for now
               echo ">>> Routing ${{ inputs.root_manager }} to shoey63 Canary fork..."
               echo "USE_DYNAMIC_TRANSPLANT=false" >> $GITHUB_ENV
               echo "SUSFS_REPO_URL=https://gitlab.com/simonpunk/susfs4ksu.git" >> $GITHUB_ENV
               echo "KSU_VARIANT_REPO_URL=https://github.com/shoey63/${{ inputs.root_manager }}.git" >> $GITHUB_ENV
               echo "KSU_VARIANT_REF=stable" >> $GITHUB_ENV
             fi

          else
            echo ">>> Routing to Safe Fallback Forks (Stable/Test)..."
            echo "USE_DYNAMIC_TRANSPLANT=false" >> $GITHUB_ENV
            echo "SUSFS_REPO_URL=https://gitlab.com/shoey63/susfs4ksu.git" >> $GITHUB_ENV
            echo "KSU_VARIANT_REPO_URL=https://github.com/shoey63/${{ inputs.root_manager }}.git" >> $GITHUB_ENV
            echo "KSU_VARIANT_REF=${{ inputs.build_channel }}" >> $GITHUB_ENV
          fi

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync kernel source
        run: |
          set -euo pipefail
          rm -rf kernel_workspace && mkdir -p kernel_workspace && cd kernel_workspace
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          repo sync -c --no-tags --no-clone-bundle --current-branch --fail-fast -j$(nproc)

          # Capture the PURE Google hash AND the official Unix timestamp
          cd common
          echo "OFFICIAL_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OFFICIAL_DATE=$(git log -1 --format=%ct)" >> $GITHUB_ENV
          echo ">>> Captured Hash: $(git rev-parse --short HEAD)"
          echo ">>> Captured Date: $(git log -1 --format=%ct)"

      - name: Integrate Root Manager (${{ inputs.root_manager }})
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        env:
          KSU_VARIANT_REPO_URL: ${{ env.KSU_VARIANT_REPO_URL }}
          KSU_VARIANT_REF: ${{ env.KSU_VARIANT_REF }}
          USE_DYNAMIC_TRANSPLANT: ${{ env.USE_DYNAMIC_TRANSPLANT }}
          BUILD_CHANNEL: ${{ inputs.build_channel }}
          INTEGRATE_SUSFS: ${{ inputs.enable_ksu_susfs }}
        run: |
          bash ./scripts/inject_ksu_variant.sh "${{ inputs.root_manager }}"

      - name: Calculate Dynamic SuSFS Branch
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          MANIFEST="${{ env.MANIFEST_BRANCH }}"

          if [[ -n "$MANIFEST" ]]; then
              echo ">>> Calculating SuSFS branch from manifest branch: $MANIFEST..."
              SUSFS_BRANCH=$(echo "$MANIFEST" | sed -E 's/common-(android[0-9]+-[0-9]+\.[0-9]+).*/gki-\1-dev/')
              echo ">>> Target SuSFS Branch mapped to: $SUSFS_BRANCH"
              echo "SUSFS_NEXT_REF=${SUSFS_BRANCH}" >> $GITHUB_ENV

              # Export to GITHUB_ENV
              echo "SUSFS_BRANCH=${SUSFS_BRANCH}" >> $GITHUB_ENV
              echo ">>> Target SuSFS Branch set to: ${SUSFS_BRANCH}"
          else
              echo "[-] Warning: MANIFEST_BRANCH not found. Falling back to default."
              echo "SUSFS_BRANCH=gki-android14-6.1-dev" >> $GITHUB_ENV
          fi

      - name: Integrate SUSFS common-side
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        env:
          SUSFS_NEXT_URL: ${{ env.SUSFS_REPO_URL }}
          SUSFS_NEXT_REF: ${{ env.SUSFS_BRANCH }}
        run: |
          bash ./scripts/integrate_susfs.sh

      - name: Fix SUSFS Patch Rejections
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        run: |
          bash ./scripts/fix_susfs_rejections.sh

      - name: Configure Kconfigs and Fragments
        env:
          WITH_CUSTOM: ${{ inputs.custom_kconfigs }}
        run: |
          # Export for the CURRENT step so the script can see it immediately
          export BASE_VER=$(echo "${{ inputs.target_version }}" | cut -d. -f1,2)
          
          # Write to GITHUB_ENV for any FUTURE steps that might need it
          echo "BASE_VER=$BASE_VER" >> $GITHUB_ENV
          
          chmod +x scripts/configure_kconfigs.sh
          ./scripts/configure_kconfigs.sh

      - name: Inject User Source Files
        if: ${{ inputs.custom_patches }}
        run: |
          SRC_DIR="$(pwd)/tools/user_source"

          # Check if the directory exists and contains files
          if [ -d "$SRC_DIR" ] && [ "$(ls -A "$SRC_DIR")" ]; then
            echo ">>> User source files detected. Injecting into common tree..."
            shopt -s dotglob nullglob
            cp -r "$SRC_DIR"/* kernel_workspace/common/
            echo ">>> Source injection complete."
          else
            echo ">>> No raw source files found in tools/user_source/."
          fi
        shell: bash
        
      - name: Apply User Patches
        if: ${{ inputs.custom_patches }}
        run: |
          PATCH_DIR="$(pwd)/tools/user_patches"
          
          # Extract BASE_VER from target_version input (e.g., 6.1.145 -> 6.1)
          BASE_VER=$(echo "${{ inputs.target_version }}" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
          echo ">>> Target Base Version for patches: $BASE_VER"

          # Check if the directory exists and contains any .patch files
          if [ -d "$PATCH_DIR" ] && ls "$PATCH_DIR"/*.patch >/dev/null 2>&1; then
            echo ">>> User patches detected in tools/user_patches/. Filtering by version..."
            cd kernel_workspace/common

            # Iterate through every patch found
            for patch_file in "$PATCH_DIR"/*.patch; do
              filename=$(basename "$patch_file")
              
              # Condition 1: Patch exactly matches the current BASE_VER (e.g., 6.1-0001.patch)
              if [[ "$filename" == "${BASE_VER}-"* ]]; then
                echo "  -> [MATCH] Applying version-specific patch: $filename..."
                patch -p1 --no-backup-if-mismatch < "$patch_file"
                
              # Condition 2: Patch starts with ANY version prefix (e.g., 6.6-0005.patch)
              elif [[ "$filename" =~ ^[0-9]+\.[0-9]+- ]]; then
                echo "  -> [SKIP] Ignoring patch for different kernel version: $filename"
                
              # Condition 3: Patch has no version prefix (e.g., 0007-generic.patch)
              else
                echo "  -> [GENERIC] Applying generic patch: $filename..."
                patch -p1 --no-backup-if-mismatch < "$patch_file"
              fi
            done

            cd ../..
            echo ">>> User patching complete."
          else
            echo ">>> No user patches found in tools/user_patches/. Proceeding with stock source."
          fi
        shell: bash

      - name: Build common kernel Image
        env:
          WITH_CUSTOM: ${{ inputs.custom_kconfigs }}
          ROOT_MANAGER: ${{ inputs.root_manager }}
        run: |
          # Injecting the REAL Google identity into the script session
          OFFICIAL_HASH=${{ env.OFFICIAL_HASH }} \
          OFFICIAL_DATE=${{ env.OFFICIAL_DATE }} \
          bash ./scripts/build_kernel.sh
          
      - name: Pull stock boot.img from OTA
        if: env.REPACK_ENABLED == 'true'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install git+https://github.com/shoey63/payload-dumper
          mkdir -p work/stock
          python3 ./scripts/ota_pull.py \
            --source "$OTA_URL" \
            --partition boot \
            --outdir work/stock
          echo ">>> Pulled stock boot image(s)"
          find work/stock -maxdepth 1 -type f \( -name 'boot.img' -o -name 'boot-*.img' \) -ls

      - name: Repack boot image with built Image
        if: env.REPACK_ENABLED == 'true'
        run: |
          mkdir -p out/final
          mkdir -p work/repack-tmp
          chmod +x ./tools/magiskboot || true

          BOOT_IMG="$(find work/stock -maxdepth 1 -type f \( -name 'boot.img' -o -name 'boot-*.img' \) | head -n 1)"
          [ -n "$BOOT_IMG" ] || { echo "[-] Could not find stock boot image"; exit 1; }

          STOCK_NAME="$(basename "$BOOT_IMG" .img)"

          bash ./scripts/boot_swap.sh \
            --boot "$BOOT_IMG" \
            --image "out/Image" \
            --magiskboot "./tools/magiskboot" \
            --outdir "out/final" \
            --outname "${STOCK_NAME}-repacked.img" \
            --workdir "work/repack-tmp"
            
      - name: Prepare Final Artifacts
        run: |
          mkdir -p out/final
          echo -e "MANIFEST_URL=${MANIFEST_URL}\nMANIFEST_BRANCH=${MANIFEST_BRANCH}\nOTA_URL=${OTA_URL}\nTIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > out/final/repack_metadata.txt

          SAFE_BUILD_NAME=$(echo "${{ inputs.build_name }}" | tr ' /' '__')
          AK3_REPO="https://github.com/shoey63/AnyKernel3.git"
          AK3_BRANCH="master"

          # ---------------------------------------------------------
          # 1. SETUP ANYKERNEL3 BASE
          # ---------------------------------------------------------
          git clone --depth=1 -b "$AK3_BRANCH" "$AK3_REPO" AnyKernel3-Builder
          rm -rf AnyKernel3-Builder/.git AnyKernel3-Builder/README.md AnyKernel3-Builder/*placeholder

          echo ">>> Locating kernel Image..."
          IMAGE_PATH=$(find . -name "Image" -type f | grep -v "AnyKernel3" | head -n 1)
          if [ -n "$IMAGE_PATH" ]; then
            cp -f "$IMAGE_PATH" AnyKernel3-Builder/
            echo ">>> Successfully copied Image from: $IMAGE_PATH"
          else
            echo "[-] ERROR: Kernel Image not found in workspace!"
            exit 1
          fi

          # ---------------------------------------------------------
          # 2. FINALIZE AK3 / OTA ARTIFACTS
          # ---------------------------------------------------------
          if [ "$REPACK_ENABLED" != "true" ]; then
            echo "ARTIFACT_NAME=${{ inputs.root_manager }}-${{ inputs.target_version }}-AK3" >> $GITHUB_ENV
            cd AnyKernel3-Builder
            zip -r9 "../out/final/${{ inputs.root_manager }}-${{ inputs.target_version }}-AK3.zip" *
            cd ..
          else
            echo "ARTIFACT_NAME=${SAFE_BUILD_NAME}" >> $GITHUB_ENV
            cd AnyKernel3-Builder
            zip -r9 "../out/final/${{ inputs.root_manager }}-${{ inputs.target_version }}-AK3.zip" *
            cd ..
          fi

          echo ">>> Final Artifact Directory:"
          ls -lah out/final/

      - name: Build NetHunter KernelSU Module
        run: |
          echo ">>> Staging compiled wireless modules..."
          mkdir -p /tmp/kmod_staging
          
          # 1. Sanitize the build name (converts spaces/slashes to a single underscore)
          SAFE_BUILD_NAME=$(echo "${{ inputs.build_name }}" | tr ' /' '_' | tr -s '_')
          echo "SAFE_BUILD_NAME=${SAFE_BUILD_NAME}" >> $GITHUB_ENV

          # 2. Define the target driver patterns
          MODULE_PATTERNS=(
              # Core Wi-Fi
              "cfg80211.ko"
              "mac80211.ko"

              # Wi-Fi Adapters
              "mt76*.ko"
              "ath*.ko"
              "carl9170.ko"

              # Bluetooth
              "bt*.ko"
              "bfusb.ko"

              # Dependencies (Crypto, I2C - ledtrig intentionally removed)
              "i2c-mux.ko"

              # The Entire SDR / DVB Suite
              "*/media/dvb-frontends/*.ko"
              "*/media/tuners/*.ko"
              "*/media/usb/dvb-usb-v2/*.ko"
              "dvb*.ko"
              "rtl*.ko"

              # Compiler Generated Load Order
              "modules.order"
              "modules.load"
          )

          # 3. Find and copy them into the staging directory
          echo ">>> Searching for modules..."
          for pattern in "${MODULE_PATTERNS[@]}"; do
            if [[ "$pattern" == *"/"* ]]; then
              # Use -path to safely match directory strings
              find . -path "$pattern" -type f -exec cp {} /tmp/kmod_staging/ \;
            else
              # Use -name for standard filenames
              find . -name "$pattern" -type f -exec cp {} /tmp/kmod_staging/ \;
            fi
          done
          
          # 4. FAIL-SAFE: Check if any .ko files were actually found
          KO_COUNT=$(ls -1 /tmp/kmod_staging/*.ko 2>/dev/null | wc -l)
          if [ "$KO_COUNT" -eq 0 ]; then
            echo ">>> No NetHunter .ko files found. Skipping NetHunter Module creation."
            echo "HAS_NETHUNTER=false" >> $GITHUB_ENV
            exit 0
          fi
          
          echo ">>> Successfully staged $KO_COUNT modules!"
          echo "HAS_NETHUNTER=true" >> $GITHUB_ENV
          
          # 5. Make sure the script is executable
          chmod +x scripts/build_nethunter_module.sh
          
          # 6. Execute custom builder script
          echo ">>> Executing build_nethunter_module.sh..."
          ./scripts/build_nethunter_module.sh "/tmp/kmod_staging" "$SAFE_BUILD_NAME"

      - name: Upload NetHunter Module Artifact
        if: env.HAS_NETHUNTER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_BUILD_NAME }}-NetHunter-Module
          path: ksu_nethunter_module/
          if-no-files-found: error

      # ---------------------------------------------------------
      # NEW: Compile custom Manager from source ONLY on 'test' channel
      # ---------------------------------------------------------
      - name: Setup Java for Custom Manager Build
        if: inputs.enable_ksu_susfs == true && inputs.build_channel == 'test' && inputs.root_manager == 'KernelSU-Next'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Rust & Cargo-NDK
        if: inputs.enable_ksu_susfs == true && inputs.build_channel == 'test' && inputs.root_manager == 'KernelSU-Next'
        run: |
          echo ">>> Setting up Rust targets for Android..."
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          echo ">>> Installing cargo-ndk..."
          cargo install cargo-ndk

      - name: Build Custom Manager APK (Test Channel)
        if: inputs.enable_ksu_susfs == true && inputs.build_channel == 'test' && inputs.root_manager == 'KernelSU-Next'
        env:
          KSU_VARIANT_REPO_URL: ${{ env.KSU_VARIANT_REPO_URL }}
          KSU_VARIANT_REF: ${{ env.KSU_VARIANT_REF }}
        run: |
          echo ">>> Compiling custom manager from $KSU_VARIANT_REPO_URL branch $KSU_VARIANT_REF..."

          git clone --recursive -b "$KSU_VARIANT_REF" "$KSU_VARIANT_REPO_URL" custom_manager_src
          cd custom_manager_src
          git fetch --tags

          echo ">>> Compiling ksud native binaries..."
          cd userspace/ksud
          # Use cargo-ndk to automatically handle Android NDK linkers
          cargo ndk -t arm64-v8a -t x86_64 build --release

          echo ">>> Injecting ksud into Manager jniLibs..."
          mkdir -p ../../manager/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../../manager/app/src/main/jniLibs/x86_64

          # The magic trick: copy the executable and disguise it as a .so library
          cp target/aarch64-linux-android/release/ksud ../../manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          cp target/x86_64-linux-android/release/ksud ../../manager/app/src/main/jniLibs/x86_64/libksud.so
                    cd ../../manager
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          chmod +x gradlew

          # Tell Gradle to build the debug variant using the repo's static keystore
          ./gradlew assembleDebug

          echo ">>> Moving compiled APK to artifact directory..."
          mkdir -p ../../manager_apk

          # Point the copy command to the 'debug' output folder instead of 'release'
          cp app/build/outputs/apk/debug/*.apk ../../manager_apk/ 2>/dev/null || cp app/build/outputs/apk/**/*.apk ../../manager_apk/

      # ---------------------------------------------------------
      # MODIFIED: Fetch upstream APK on 'dynamic' or 'stable', bypass on 'test'
      # ---------------------------------------------------------
      - name: Fetch Matching Manager APK
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true && (inputs.build_channel != 'test' || inputs.root_manager != 'KernelSU-Next')
        id: fetch_manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ inputs.root_manager }}
          UPSTREAM_HASH: ${{ env.UPSTREAM_HASH }}
        run: |
          chmod +x scripts/fetch_manager.sh
          ./scripts/fetch_manager.sh "$VARIANT" "$GH_TOKEN" "$UPSTREAM_HASH"

      - name: Upload final artifact (Kernel)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/final/
          if-no-files-found: error

      - name: Upload Manager APK
        if: inputs.root_manager != 'Stock' && inputs.enable_ksu_susfs == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.root_manager }}-Manager
          path: manager_apk/*.apk
          if-no-files-found: error
